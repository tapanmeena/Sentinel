<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recordings | SENTINEL Security Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}">
    <script src="{{ url_for('static', filename='js/common.js') }}"></script>
    <script src="{{ url_for('static', filename='js/lucide.min.js') }}" defer></script>
</head>
<body class="home-page">
    <!-- Background Effects -->
    <div class="bg-grid"></div>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>
    
    <div class="app">
        <!-- Sidebar -->
        {% set active_page = 'recordings' %}
        {% include 'components/sidebar.html' %}

        <!-- Header -->
        {% include 'components/page_header.html' %}

        <!-- Main Content -->
        <main class="main recordings-main">
            <!-- Video Player Section -->
            <section class="video-player-section" id="video-player-section" style="display: none;">
                <div class="player-wrapper">
                    <video id="video-player" controls playsinline>
                        <source id="video-source" src="" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                </div>
                <div class="player-controls">
                    <button class="back-to-list-btn" id="back-to-list">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="19" y1="12" x2="5" y2="12"/>
                            <polyline points="12 19 5 12 12 5"/>
                        </svg>
                        Back to recordings
                    </button>
                    <span class="now-playing" id="now-playing"></span>
                </div>
            </section>

            <!-- Recordings List Section -->
            <section class="recordings-section" id="recordings-section">
                <div class="recordings-header">
                    <div class="recordings-title">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/>
                            <polygon points="10 8 16 12 10 16 10 8"/>
                        </svg>
                        <h2>All Recordings</h2>
                        <span class="recordings-total" id="recordings-total">0 videos</span>
                    </div>
                    <div class="view-toggle">
                        <button class="view-toggle-btn active" id="grid-view-btn" title="Grid View">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="3" width="7" height="7"/>
                                <rect x="14" y="3" width="7" height="7"/>
                                <rect x="14" y="14" width="7" height="7"/>
                                <rect x="3" y="14" width="7" height="7"/>
                            </svg>
                        </button>
                        <button class="view-toggle-btn" id="table-view-btn" title="Table View">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="8" y1="6" x2="21" y2="6"/>
                                <line x1="8" y1="12" x2="21" y2="12"/>
                                <line x1="8" y1="18" x2="21" y2="18"/>
                                <line x1="3" y1="6" x2="3.01" y2="6"/>
                                <line x1="3" y1="12" x2="3.01" y2="12"/>
                                <line x1="3" y1="18" x2="3.01" y2="18"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Recordings Content -->
                <div class="recordings-content">
                    <div class="recordings-loading" id="recordings-loading">
                        <div class="spinner"></div>
                        <span>Loading recordings...</span>
                    </div>
                    <div class="recordings-empty" id="recordings-empty" style="display: none;">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/>
                            <polygon points="10 8 16 12 10 16 10 8"/>
                        </svg>
                        <p>No recordings found</p>
                        <a href="/" class="empty-action-btn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                                <circle cx="12" cy="13" r="4"/>
                            </svg>
                            Go to Live View
                        </a>
                    </div>
                    <div class="recordings-grid" id="recordings-grid"></div>
                    <div class="recordings-table-container" id="recordings-table" style="display: none;">
                        <table class="recordings-table">
                            <thead>
                                <tr>
                                    <th>Thumbnail</th>
                                    <th>Camera</th>
                                    <th>Filename</th>
                                    <th>Date</th>
                                    <th>Size</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="recordings-table-body">
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        // Inject cameras data
        window.CAMERAS = {{ cameras | tojson | safe }};
    </script>
    <script src="{{ url_for('static', filename='js/recordings.js') }}"></script>
</body>
</html>
