<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{ camera_name }}</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        #feed {
            width: 100%;
            height: 100%;
            object-fit: {{ fit }};
            display: block;
        }
        #feed.hidden { visibility: hidden; }
    </style>
</head>
<body>
    <img id="feed" alt="">
    <script>
        (function () {
            var STREAM_URL = "{{ stream_url }}";
            var img = document.getElementById('feed');
            var attempt = 0;
            var retryTimer = null;
            var watchdogTimer = null;
            var lastState = null;

            function post(state, detail) {
                if (lastState === state) return;
                lastState = state;
                if (window.ReactNativeWebView) {
                    window.ReactNativeWebView.postMessage(JSON.stringify({
                        type: 'stream-status',
                        state: state,
                        attempt: attempt,
                        detail: detail || null
                    }));
                }
            }

            function backoffDelay() {
                return Math.min(30000, 1000 * Math.pow(2, Math.max(0, attempt - 1)));
            }

            function clearTimers() {
                if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
                if (watchdogTimer) { clearTimeout(watchdogTimer); watchdogTimer = null; }
            }

            function connect() {
                clearTimers();
                post(attempt === 0 ? 'connecting' : 'reconnecting');
                img.classList.add('hidden');
                // Cache-busting param forces a fresh multipart connection.
                img.src = STREAM_URL + (STREAM_URL.indexOf('?') === -1 ? '?' : '&') + '_r=' + Date.now();
                // If no frame arrives in 15s treat it as a stalled connection.
                watchdogTimer = setTimeout(function () {
                    if (!img.complete || img.naturalWidth === 0) scheduleRetry('timeout');
                }, 15000);
            }

            function scheduleRetry(reason) {
                clearTimers();
                attempt += 1;
                post(attempt > 5 ? 'error' : 'reconnecting', reason);
                retryTimer = setTimeout(connect, backoffDelay());
            }

            img.addEventListener('load', function () {
                attempt = 0;
                clearTimers();
                img.classList.remove('hidden');
                post('connected');
            });

            img.addEventListener('error', function () { scheduleRetry('error'); });
            img.addEventListener('stalled', function () { scheduleRetry('stalled'); });

            document.addEventListener('visibilitychange', function () {
                if (document.hidden) {
                    clearTimers();
                    img.src = '';
                    lastState = null;
                    post('paused');
                } else {
                    attempt = 0;
                    connect();
                }
            });

            window.addEventListener('message', function (event) {
                if (event.data === 'reload') { attempt = 0; connect(); }
            });

            connect();
        })();
    </script>
</body>
</html>
